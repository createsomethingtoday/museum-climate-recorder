name: Publish ARM64 recorder
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the recorder
        run: |
          docker build --platform linux/arm64 -f delivery/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME}" .
          printf '7\n10\n10\n' | docker run --rm -i "ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME}" > actual
          printf 'accepted 7\nmissing 2\naccepted 10\nstale\n' | diff - actual
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY"
          docker tag "$image:${GITHUB_REF_NAME}" "$image:latest"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
